# =============================================================================
#  nginx para api.gpsrolandoplazas.com  (destino: /etc/nginx/sites-available/miapi)
#
#  Cambios frente a la configuración original (proxy simple + bloque de certbot):
#   - HTTP/2: el navegador hace todas las peticiones en paralelo por una conexión.
#   - Conexiones persistentes con la API (upstream keepalive): no se abre una
#     conexión TCP nueva hacia Kestrel en cada petición.
#   - /uploads/ lo sirve nginx directamente desde ~/miapi-shared, con caché de 7 días.
#   - client_max_body_size 10m: nginx rechazaba con 413 cualquier subida > 1 MB
#     (imágenes del CMS y hojas de vida, que la API acepta hasta 5 MB).
#   - gzip para respuestas que la API no comprime (estáticos, errores).
#   - Cabeceras de seguridad y server_tokens off.
#
#  Las rutas de certificados son las que crea certbot. Antes de aplicar, compáralas
#  con /etc/nginx/sites-available/miapi actual (ver deploy/README.md).
# =============================================================================

upstream miapi_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.gpsrolandoplazas.com;

    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04): HTTP/2 se activa en la directiva listen.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gpsrolandoplazas.com;

    ssl_certificate     /etc/letsencrypt/live/api.gpsrolandoplazas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gpsrolandoplazas.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Subidas del CMS (imágenes) y hojas de vida: la API limita a 5 MB; margen para multipart.
    client_max_body_size 10m;

    # ---- Cabeceras de seguridad (always = también en respuestas de error) ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---- Compresión (la API ya comprime su JSON; nginx no lo vuelve a comprimir) ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    # ---- Imágenes subidas desde el CMS: las entrega nginx, sin pasar por la API ----
    # Las hojas de vida NO están aquí (viven en ~/miapi-shared/uploads, fuera de la web).
    location /uploads/ {
        alias /home/ubuntu/miapi-shared/wwwroot-uploads/;
        try_files $uri =404;
        autoindex off;

        expires 7d;
        add_header Cache-Control "public" always;
        # add_header dentro de un location reemplaza los del server: se repiten aquí.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        # Las imágenes deben poder mostrarse en gpsrolandoplazas.com (otro origen).
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        # Si alguien logró subir un .html o .svg con scripts, el navegador no los ejecuta.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;

        access_log off;
    }

    # ---- Todo lo demás va a la API ----
    location / {
        proxy_pass         http://miapi_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
